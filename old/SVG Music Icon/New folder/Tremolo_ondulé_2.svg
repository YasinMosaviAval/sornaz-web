  <title
     id="title3712">tremolo ondulé</title>
  <metadata
     id="metadata212">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type
           rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
        <dc:title>tremolo ondulé</dc:title>
        <dc:creator>
          <cc:Agent>
            <dc:title>Hector Berlioz</dc:title>
          </cc:Agent>
        </dc:creator>
        <cc:license
           rdf:resource="http://creativecommons.org/publicdomain/mark/1.0/" />
        <dc:description>Il y a enfin une dernière espèce de tremolo qu’on n’emploie jamais aujourd’hui, mais dont Gluck a tiré un parti admirable dans ses récitatifs, je l’appellerai tremolo ondulé. Il consiste dans l’émission peu rapide de notes liées entre elles sur le même son et sans que l’archet quitte la corde.</dc:description>
      </cc:Work>
