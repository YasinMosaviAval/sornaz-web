# Add inside BOTH domain server blocks (HTTP and HTTPS), not in .htaccess.
# This contains no backend/upstream assumptions and does not affect public avatars.
# Existing conflicting locations must be merged by the hosting administrator.
# More-specific existing locations/aliases must also be reviewed.

location ^~ /storage/chat/ { add_header Cache-Control "no-store" always; return 403; }
location ^~ /storage/sessions/ { add_header Cache-Control "no-store" always; return 403; }
location ^~ /storage/backups/ { add_header Cache-Control "no-store" always; return 403; }
location ^~ /storage/logs/ { add_header Cache-Control "no-store" always; return 403; }
location ^~ /storage/social-media/ { add_header Cache-Control "no-store" always; return 403; }
location ^~ /storage/course-media/ { add_header Cache-Control "no-store" always; return 403; }

# Account-media and assets/media/library mix public and private records.
# They also need the application handoff described in private-files-hosting.md.
# Do not allow a static extension location to serve those directories directly.
