# Include inside the site's server block BEFORE other regex locations.
# Replace any existing generic PHP execution location with the exact /index.php
# location documented in release-security.md. Do not use a ^~ /assets/ location:
# it would bypass the media-library access checks below.
autoindex off;

location ~ (^|/)\.(?!well-known(?:/|$)) { return 403; }
location ~* ^/(core|Modules|bootstrap|config|routes|resources|vendor|docs|scripts|tests|old)(/|$) { return 403; }
location ~* (\.(sql|log|bak|backup|ini|env|lock|sqlite|sqlite3)(\..*)?$|/composer\.json$|/sornaz$) { return 403; }
location ~* \.(php[0-9]*|phtml|phar)(/|$) { return 403; }

location ~ ^/storage/account-media/[^/]+/[^/]+/[^/]+/[^/]+$ {
    rewrite ^ /index.php last;
}
location ~ ^/assets/media/library/[^/]+/[^/]+/[^/]+$ {
    rewrite ^ /index.php last;
}
location ~* ^/assets/media/library(/|$) { return 403; }
location ~* ^/storage(/|$) { return 403; }
