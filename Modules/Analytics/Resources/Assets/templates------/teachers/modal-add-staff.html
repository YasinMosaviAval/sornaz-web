<template id="add-staff-modal-template">
    <div class="modal">
        <div class="modal-content">
            <h3>ثبت پرسنل جدید</h3>
            <form id="addStaffForm">
                <div class="form-row">
                    <label>نام</label>
                    <input name="name">
                </div>
                <div class="form-row">
                    <label>تلفن</label>
                    <input name="phone">
                </div>
                <div class="form-row">
                    <label>سمت</label>
                    <select name="role"></select>
                </div>
                <div class="form-row">
                    <label>شعبه</label>
                    <select name="branch"></select>
                </div>
                <div class="modal-footer">
                    <button type="submit">ثبت</button>
                    <button type="button" class="close-modal">انصراف</button>
                </div>
            </form>
        </div>
    </div>
</template>
