<template id="pdf-options-template">
    <div class="modal">
        <div class="modal-content">
            <h3>تنظیمات خروجی PDF</h3>
            <label>اندازه کاغذ</label>
            <select id="paperSize">
                <option>A4</option>
                <option>A3</option>
            </select>
            <label>جهت صفحه</label>
            <select id="orientation">
                <option>portrait</option>
                <option>landscape</option>
            </select>
            <button id="generatePDF">تولید PDF</button>
        </div>
    </div>
</template>
