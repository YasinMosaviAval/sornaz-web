<template id="inline-edit-template">
    <tr class="inline-edit">
        <td colspan="7">
            <div class="edit-grid">
                <input class="edit-name" type="text">
                <input class="edit-phone" type="text">
                <select class="edit-role">
                    <option value="teacher">استاد</option>
                    <option value="manager">مدیر</option>
                </select>
                <select class="edit-status">
                    <option value="active">فعال</option>
                    <option value="inactive">غیرفعال</option>
                </select>
                <div class="actions">
                    <button class="btn-save">ذخیره</button>
                    <button class="btn-cancel">انصراف</button>
                </div>
            </div>
        </td>
    </tr>
</template>
